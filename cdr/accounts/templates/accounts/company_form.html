{% extends "partials/base.html" %}
{% block title %}Company Form{% endblock title %}
{% block content %}
<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header"><strong>{{ form.instance.pk|yesno:"Edit Company,Add Company" }}</strong></div>
        <div class="card-body">
          <form method="post">{% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{% url 'accounts:superadmin_dashboard' %}" class="btn btn-secondary">Cancel</a>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock content %}
