{% extends 'accounts/base.html' %}
{% block content %}
<div class="d-flex justify-content-center align-items-center min-vh-100">
    <div class="card shadow-lg p-4" style="min-width:340px; max-width:400px; width:100%; border-radius: 16px;">
        <div class="card-body">
            <h3 class="mb-3 text-center fw-bold" style="letter-spacing: 0.5px;">Forgot Password?</h3>
            <p class="text-center text-muted mb-4">Enter your email address and we'll send you a one-time code to reset your password.</p>
            {% if error %}<div class="alert alert-danger text-center">{{ error }}</div>{% endif %}
            <form method="post" autocomplete="off">
                {% csrf_token %}
                <div class="mb-3">
                    <input type="email" name="email" class="form-control" placeholder="Enter your email" required id="id_email" value="{{ form.email.value|default:'' }}">
                </div>
                <button type="submit" class="btn btn-primary w-100">Send OTP</button>
            </form>
            <div class="mt-3 text-center">
                <a href="{% url 'accounts:login' %}" class="text-decoration-none">Back to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
