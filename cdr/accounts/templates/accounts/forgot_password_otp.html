{% extends 'accounts/base.html' %}
{% block content %}
<div class="d-flex justify-content-center align-items-center min-vh-100">
    <div class="card shadow-lg p-4" style="min-width:340px; max-width:400px; width:100%; border-radius: 16px;">
        <div class="card-body">
            <h3 class="mb-3 text-center fw-bold">Enter OTP</h3>
            <p class="text-center text-muted mb-4">We've sent a one-time code to your email{% if email %} <span class="fw-bold">({{ email }})</span>{% endif %}.<br>Enter it below to continue.</p>
            {% if error %}<div class="alert alert-danger text-center">{{ error }}</div>{% endif %}
            <form method="post" autocomplete="off">
                {% csrf_token %}
                <div class="mb-3">
                    <input type="text" name="otp_code" class="form-control" placeholder="Enter OTP" required id="id_otp_code" value="{{ form.otp_code.value|default:'' }}">
                </div>
                <button type="submit" class="btn btn-success w-100">Verify OTP</button>
            </form>
            <div class="mt-3 text-center">
                <a href="{% url 'accounts:forgot_password_request' %}" class="text-decoration-none">Resend OTP</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
