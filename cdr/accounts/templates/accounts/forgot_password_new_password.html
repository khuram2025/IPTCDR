{% extends 'accounts/base.html' %}
{% load static %}
{% block content %}
<div class="d-flex justify-content-center align-items-center min-vh-100">
    <div class="card shadow-lg p-4" style="min-width:340px; max-width:400px; width:100%; border-radius: 16px;">
        <div class="card-body">
            <h3 class="mb-3 text-center fw-bold">Set New Password</h3>
            <p class="text-center text-muted mb-4">Enter your new password below.</p>
            <form method="post" autocomplete="off">
                {% csrf_token %}
                <div class="mb-3">
                    <div class="input-group">
  <input type="password" name="new_password1" class="form-control" placeholder="New password" required id="id_new_password1">
  <span class="input-group-text" style="cursor:pointer">
    <i class="fa fa-eye toggle-password" data-target="id_new_password1"></i>
  </span>
</div>
                </div>
                <div class="mb-3">
                    <div class="input-group">
  <input type="password" name="new_password2" class="form-control" placeholder="Confirm new password" required id="id_new_password2">
  <span class="input-group-text" style="cursor:pointer">
    <i class="fa fa-eye toggle-password" data-target="id_new_password2"></i>
  </span>
</div>
                </div>
                <button type="submit" class="btn btn-primary w-100">Reset Password</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/password-visibility.js' %}"></script>
{% endblock %}
